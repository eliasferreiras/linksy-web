name: Build Site

# on:
#   workflow_call:

permissions:
  contents: read

concurrency:
  group: linksy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build
    runs-on: ubuntu-latest

    steps:
      # 1. Obtém o código do repositório
      - name: Checkout
        uses: actions/checkout@v6

      # 2. Configura o Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # 3. Instala as dependências
      - name: Install dependencies
        run: npm ci

      # 4. Executa o build do Vite
      - name: Build
        run: npm run build