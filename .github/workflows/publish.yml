name: Linksy - Deploy

on:
  workflow_call:

jobs:

  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:

      # 1. Baixa o artifact do build
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: linksy-dist
          path: dist/

      # 5. Configura o acesso SSH
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          echo "${{ secrets.SERVER_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # 6. Publica os arquivos no servidor
      - name: Deploy
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.SERVER_SSH_PORT }}" \
            dist/ \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/var/www/linksy/