name: Linksy - Deploy

on:
  workflow_call:

jobs:

  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:

      # 1. Obtém o código do repositório
      - name: Checkout
        uses: actions/checkout@v6

      # 2. Configura o Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # 3. Instala as dependências
      - name: Install dependencies
        run: npm ci

      # 4. Executa o build do Vite
      - name: Build
        run: npm run build

      # 5. Configura o acesso SSH
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          echo "${{ secrets.SERVER_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # 6. Publica os arquivos no servidor
      - name: Deploy
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.SERVER_SSH_PORT }}" \
            dist/ \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/var/www/linksy/